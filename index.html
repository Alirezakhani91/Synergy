<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f0f7">
  <title>Synergy Academy CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261009-134">
</head>
<body>
  <div class="synergy-decor" aria-hidden="true">
    <span class="gummy g1">🐱</span>
    <span class="gummy g2">🐾</span>
    <span class="gummy g3">🐶</span>
    <span class="gummy g4">🐰</span>
  </div>

  <div id="toast"></div>
  <div id="loading" class="loading hidden"><div class="spinner"></div><span>در حال دریافت اطلاعات...</span></div>

  <div id="appView" class="app">
    <div id="mobileScrim" class="mobile-scrim"></div>
    <aside class="sidebar">
      <div class="side-brand">
        <div class="brand-mark small">S</div>
        <div><b>Synergy</b><span>Academy CRM</span></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-footer">
        <div class="connection"><i id="connectionDot"></i><span id="connectionText">در حال اتصال</span></div>
        <button id="refreshBtn" class="nav-btn">↻ بروزرسانی اطلاعات</button>
      </div>
    </aside>

    <main>
      <header>
        <button id="menuBtn" class="icon-btn" aria-label="منو">☰</button>
        <div class="head-copy"><h2 id="pageTitle">امروز</h2><p id="pageSub">مرکز عملیات روزانه آکادمی</p></div>
        <div class="header-actions">
          <button class="secondary desktop-add" data-action="newLead">+ مشتری جدید</button>
          <div class="today" id="today"></div>
        </div>
      </header>
      <div id="content" class="content"></div>
    </main>

    <nav id="bottomNav" class="bottom-nav"></nav>
    <button id="mobileFab" class="mobile-fab" data-action="newLead" aria-label="مشتری جدید">+</button>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button id="modalClose" class="modal-close" aria-label="بستن">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="config.js?v=20261009-1"></script>
  <script src="app.js?v=20261009-212"></script>
</body>
</html>
