<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta name="theme-color" content="#14162a">

  <title>Synergy Academy CRM</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- =========================
       AMBIENT BACKGROUND
  ========================== -->

  <div class="ambient-bg" aria-hidden="true">
    <div class="aurora aurora-a"></div>
    <div class="aurora aurora-b"></div>
    <div class="aurora aurora-c"></div>
    <div class="aurora aurora-d"></div>

    <div class="animal-orbit animal-cat">🐱</div>
    <div class="animal-orbit animal-paw">🐾</div>
    <div class="animal-orbit animal-dog">🐶</div>

    <div class="gummy gummy-1"></div>
    <div class="gummy gummy-2"></div>
    <div class="gummy gummy-3"></div>

    <div class="noise"></div>
  </div>


  <!-- =========================
       TOAST
  ========================== -->

  <div id="toast"></div>


  <!-- =========================
       LOADING
  ========================== -->

  <div id="loading" class="loading hidden">
    <div class="loading-glass">

      <div class="loading-animal">
        <span>🐾</span>
      </div>

      <div class="spinner"></div>

      <strong>Synergy Academy</strong>
      <span>در حال دریافت اطلاعات...</span>

    </div>
  </div>


  <!-- =========================
       APP
  ========================== -->

  <div id="appView" class="app">

    <div id="mobileScrim" class="mobile-scrim"></div>


    <!-- SIDEBAR -->

    <aside class="sidebar glass-panel">

      <div class="side-brand">

        <div class="brand-mark">
          <span>S</span>
          <i>🐾</i>
        </div>

        <div class="brand-copy">
          <b>Synergy</b>
          <span>Academy CRM</span>
        </div>

      </div>


      <div class="side-animal-card">

        <div class="side-animal-glow"></div>

        <div class="side-animal-icon">
          🐱
        </div>

        <div>
          <small>SYNERGY ACADEMY</small>
          <strong>آموزش، ارتباط، رشد</strong>
        </div>

      </div>


      <nav id="nav"></nav>


      <div class="side-footer">

        <div class="connection glass-mini">

          <i id="connectionDot"></i>

          <div>
            <small>وضعیت دیتابیس</small>
            <span id="connectionText">
              در حال اتصال
            </span>
          </div>

        </div>

        <button
          id="refreshBtn"
          class="nav-btn refresh-btn"
        >
          <span>↻</span>
          بروزرسانی اطلاعات
        </button>

      </div>

    </aside>


    <!-- MAIN -->

    <main>

      <header class="topbar">

        <div class="header-right">

          <button
            id="menuBtn"
            class="icon-btn glass-button"
            aria-label="منو"
          >
            ☰
          </button>

          <div class="head-copy">

            <span class="page-kicker">
              SYNERGY ACADEMY
            </span>

            <h2 id="pageTitle">
              امروز
            </h2>

            <p id="pageSub">
              مرکز عملیات روزانه آکادمی
            </p>

          </div>

        </div>


        <div class="header-actions">

          <button
            class="secondary desktop-add glass-button"
            data-action="newLead"
          >
            <span>＋</span>
            مشتری جدید
          </button>

          <div class="today glass-mini">
            <span>امروز</span>
            <b id="today"></b>
          </div>

        </div>

      </header>


      <!-- MAIN CONTENT -->

      <div id="content" class="content"></div>

    </main>


    <!-- MOBILE NAV -->

    <nav
      id="bottomNav"
      class="bottom-nav glass-nav"
    ></nav>


    <!-- MOBILE FAB -->

    <button
      id="mobileFab"
      class="mobile-fab"
      data-action="newLead"
      aria-label="مشتری جدید"
    >
      <span>＋</span>
    </button>

  </div>


  <!-- =========================
       MODAL
  ========================== -->

  <div id="modal" class="modal hidden">

    <div class="modal-card glass-modal">

      <div class="modal-decoration">
        <span>🐾</span>
      </div>

      <button
        id="modalClose"
        class="modal-close"
      >
        ×
      </button>

      <div id="modalBody"></div>

    </div>

  </div>


  <!-- =========================
       SCRIPTS
  ========================== -->

  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
